[package]
name = "kpd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "KeePass-compatible TUI password manager (binary)."

[[bin]]
name = "kpd"
path = "src/main.rs"

[dependencies]
kpd-tui = { path = "../kpd-tui" }
kpd-storage = { path = "../kpd-storage" }
# Runtime for the async cloud fetch/push subcommands.
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
