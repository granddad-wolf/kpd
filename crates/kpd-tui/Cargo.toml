[package]
name = "kpd-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ratatui + crossterm terminal UI for kpd."

[dependencies]
# ratatui 0.30 is a facade crate; its default `crossterm` feature enables the
# `ratatui-crossterm` backend, which defaults to crossterm 0.29 — matching the
# direct dependency below so both resolve to a single crossterm in the graph.
crossterm = "0.29"
ratatui = "0.30"
thiserror = "2"
kpd-core = { path = "../kpd-core" }
kpd-kdbx = { path = "../kpd-kdbx" }
kpd-crypto = { path = "../kpd-crypto" }
kpd-clipboard = { path = "../kpd-clipboard" }
# Direct deps only to name `SecretString`/`ExposeSecret` and `Uuid` in our
# signatures; versions match kpd-core so they unify in the dependency graph.
secrecy = "0.10"
uuid = "1"

[lints]
workspace = true
